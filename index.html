<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Split Pay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1a1d21; --muted:#6b7280; --accent:#0a7d4f; --line:#e3e6ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1b1f25; --fg:#eef0f3; --muted:#9aa3ae; --accent:#3ecf8e; --line:#2a3039; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.4 system-ui,sans-serif; padding:16px; }
  main { max-width:420px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; text-align:center; }
  h1 { font-size:22px; margin:6px 0 14px; }
  input { width:100%; padding:14px; font-size:20px; border:1px solid var(--line); border-radius:12px; background:transparent; color:var(--fg); margin:6px 0; }
  input.amt { font-size:40px; text-align:center; font-weight:700; }
  .btn { display:block; width:100%; padding:18px; font-size:22px; font-weight:700; border:0; border-radius:14px; background:var(--accent); color:#fff; margin-top:14px; text-decoration:none; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:500; }
  .row { display:flex; gap:10px } .row .btn { margin-top:14px }
  .big { font-size:48px; font-weight:800; margin:4px 0; }
  .sub { color:var(--muted); font-size:16px; }
  .dots { display:flex; gap:8px; justify-content:center; margin:10px 0; }
  .dot { width:14px; height:14px; border-radius:50%; background:var(--line); } .dot.done { background:var(--accent); } .dot.cur { outline:3px solid var(--accent); outline-offset:2px; }
  .lang { display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  .lang button { padding:8px 16px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:16px; }
  .lang button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .hidden { display:none !important }
  #qr { display:flex; justify-content:center; padding:14px; background:#fff; border-radius:12px; margin:12px 0; }
  .poster-title { font-size:30px; font-weight:800; }
  @media print { body * { visibility:hidden } #poster, #poster * { visibility:visible } #poster { position:absolute; left:0; top:0; width:100%; border:0 } }
</style>
</head>
<body>
<main>

<!-- ============ CUSTOMER PAGE (opened from the poster QR) ============ -->
<section id="customer" class="hidden">
  <div class="lang" id="lang"></div>
  <div class="card"><div class="sub" id="shopLbl"></div><h1 id="shop"></h1></div>

  <div class="card" id="stepAmount">
    <div id="tEnter"></div>
    <input id="amt" class="amt" type="number" inputmode="decimal" placeholder="₹ 0">
    <div class="sub" id="plan"></div>
    <button class="btn" id="start"></button>
  </div>

  <div class="card hidden" id="stepPay">
    <div class="sub" id="partLbl"></div>
    <div class="big" id="partAmt"></div>
    <div class="dots" id="dots"></div>
    <a class="btn" id="payBtn" href="#"></a>
  </div>

  <div class="card hidden" id="stepAsk">
    <h1 id="tAsk"></h1>
    <div class="row"><button class="btn" id="yes"></button><button class="btn ghost" id="no"></button></div>
  </div>

  <div class="card hidden" id="stepDone"><div class="big">✅</div><h1 id="tDone"></h1><div class="big" id="doneAmt"></div></div>
</section>

<!-- ============ ONE-TIME SETUP (family member does this) ============ -->
<section id="setup" class="hidden">
  <div class="card">
    <h1>Shop setup (one time)</h1>
    <input id="upi" placeholder="Shop UPI ID  e.g. shop@upi" autocapitalize="none">
    <input id="name" placeholder="Shop name">
    <button class="btn" id="make">Make poster QR</button>
  </div>
  <div class="card hidden" id="poster">
    <div class="poster-title" id="pName"></div>
    <div id="qr"></div>
    <div class="poster-title" style="font-size:22px">Scan with phone camera<br>फोन कैमरा से स्कैन करें<br>ఫోన్ కెమెరాతో స్కాన్ చేయండి</div>
    <button class="btn" onclick="window.print()">🖨 Print poster</button>
    <div class="sub" id="linkTxt" style="word-break:break-all;margin-top:10px"></div>
  </div>
</section>

</main>

<script>
const $ = id => document.getElementById(id);
const inr = p => '₹' + (p/100).toLocaleString('en-IN', {minimumFractionDigits: p%100 ? 2 : 0});
const LIMIT = 200000; // 2000 rupees, in paise. Override with &lim=1500 in the link.

const T = {
  en:{shop:'Pay to', enter:'How much is the bill?', start:'Next', pay:'Pay', part:'Part', of:'of', split:n=>`Will be paid in ${n} parts`, one:'Single payment',
      ask:'Did the payment go through?', yes:'Yes', no:'No, try again', done:'All paid! Show this screen to the shop.'},
  hi:{shop:'यहाँ भुगतान करें', enter:'बिल कितने का है?', start:'आगे', pay:'भुगतान करें', part:'भाग', of:'/', split:n=>`${n} हिस्सों में भुगतान होगा`, one:'एक भुगतान',
      ask:'क्या पेमेंट हो गया?', yes:'हाँ', no:'नहीं, फिर से', done:'पूरा भुगतान हो गया! यह स्क्रीन दुकान को दिखाएँ।'},
  te:{shop:'చెల్లించాల్సిన షాప్', enter:'బిల్లు ఎంత?', start:'తరువాత', pay:'చెల్లించండి', part:'భాగం', of:'/', split:n=>`${n} భాగాలుగా చెల్లింపు`, one:'ఒకే చెల్లింపు',
      ask:'చెల్లింపు అయిందా?', yes:'అవును', no:'కాదు, మళ్ళీ', done:'మొత్తం చెల్లించారు! ఈ స్క్రీన్ షాప్‌కు చూపించండి.'}
};
let L = 'en';
try { L = localStorage.lang || ((navigator.language||'').startsWith('te') ? 'te' : (navigator.language||'').startsWith('hi') ? 'hi' : 'en'); } catch(e){}

function split(total, limit) {
  const n = Math.ceil(total / limit), base = Math.floor(total / n), r = total - base * n;
  return Array.from({length:n}, (_, i) => base + (i < r ? 1 : 0));
}

const q = new URLSearchParams(location.search);
const pa = q.get('pa'), pn = q.get('pn') || 'Shop';
const limit = Math.round(parseFloat(q.get('lim') || '2000') * 100) || LIMIT;

if (!pa) initSetup(); else initCustomer();

/* ---------- setup ---------- */
function initSetup() {
  $('setup').classList.remove('hidden');
  try { $('upi').value = localStorage.upi || ''; $('name').value = localStorage.shop || ''; } catch(e){}
  $('make').onclick = () => {
    const id = $('upi').value.trim(), nm = $('name').value.trim();
    if (!/^[\w.\-]+@[\w.\-]+$/.test(id)) return alert('Enter a valid UPI ID');
    if (!nm) return alert('Enter shop name');
    try { localStorage.upi = id; localStorage.shop = nm; } catch(e){}
    const url = location.origin + location.pathname + '?' + new URLSearchParams({pa:id, pn:nm});
    $('poster').classList.remove('hidden'); $('pName').textContent = nm; $('qr').innerHTML = '';
    new QRCode($('qr'), {text:url, width:260, height:260, correctLevel:QRCode.CorrectLevel.M});
    $('linkTxt').textContent = url;
  };
}

/* ---------- customer ---------- */
let parts = [], i = 0, waiting = false;

function initCustomer() {
  $('customer').classList.remove('hidden');
  $('shop').textContent = pn;
  $('lang').innerHTML = [['en','English'],['hi','हिंदी'],['te','తెలుగు']].map(([k,n]) => `<button data-l="${k}" class="${k===L?'on':''}">${n}</button>`).join('');
  $('lang').onclick = e => { if (e.target.dataset.l) { L = e.target.dataset.l; try{localStorage.lang=L}catch(_){} initCustomer(); render(); } };
  const t = T[L];
  $('shopLbl').textContent = t.shop; $('tEnter').textContent = t.enter; $('start').textContent = t.start;
  $('tAsk').textContent = t.ask; $('yes').textContent = t.yes; $('no').textContent = t.no; $('tDone').textContent = t.done;
  $('amt').oninput = () => {
    const p = Math.round(parseFloat($('amt').value) * 100);
    $('plan').textContent = p > 0 ? (p > limit ? t.split(Math.ceil(p/limit)) + ': ' + split(p, limit).map(inr).join(' + ') : '') : '';
  };
  $('start').onclick = () => {
    const p = Math.round(parseFloat($('amt').value) * 100);
    if (!(p > 0)) return $('amt').focus();
    parts = split(p, limit); i = 0; show('stepPay'); render();
  };
  $('yes').onclick = () => { i++; waiting = false; if (i >= parts.length) { $('doneAmt').textContent = inr(parts.reduce((a,b)=>a+b,0)); show('stepDone'); } else { show('stepPay'); render(); } };
  $('no').onclick = () => { waiting = false; show('stepPay'); render(); };
  $('payBtn').onclick = () => { waiting = true; };
}

function show(id) { ['stepAmount','stepPay','stepAsk','stepDone'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }

function render() {
  if (!parts.length) return;
  const t = T[L], n = parts.length;
  $('partLbl').textContent = n > 1 ? `${t.part} ${i+1} ${t.of} ${n}` : t.one;
  $('partAmt').textContent = inr(parts[i]);
  $('dots').innerHTML = parts.map((_, k) => `<span class="dot ${k<i?'done':k===i?'cur':''}"></span>`).join('');
  $('payBtn').textContent = `${t.pay} ${inr(parts[i])}`;
  const p = new URLSearchParams({pa, pn, am:(parts[i]/100).toFixed(2), cu:'INR', tn: n>1 ? `Bill part ${i+1} of ${n}` : 'Bill'});
  $('payBtn').href = 'upi://pay?' + p.toString().replace(/\+/g, '%20');
}

// When the customer comes back from their UPI app, ask if it worked.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && waiting && parts.length) show('stepAsk');
});
</script>
</body>
</html>
