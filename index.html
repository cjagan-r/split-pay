<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Split Pay</title>
<script src="config.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1a1d21; --muted:#6b7280; --accent:#0a7d4f; --line:#e3e6ea; --bad:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1b1f25; --fg:#eef0f3; --muted:#9aa3ae; --accent:#3ecf8e; --line:#2a3039; --bad:#f97066; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.4 system-ui,sans-serif; padding:16px; }
  main { max-width:420px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; text-align:center; }
  h1 { font-size:22px; margin:6px 0 14px; }
  input { width:100%; padding:14px; font-size:20px; border:1px solid var(--line); border-radius:12px; background:transparent; color:var(--fg); margin:6px 0; }
  input.amt { font-size:40px; text-align:center; font-weight:700; }
  .btn { display:block; width:100%; padding:18px; font-size:22px; font-weight:700; border:0; border-radius:14px; background:var(--accent); color:#fff; margin-top:14px; text-decoration:none; cursor:pointer; }
  .big { font-size:48px; font-weight:800; margin:4px 0; }
  .sub { color:var(--muted); font-size:16px; }
  .dots { display:flex; gap:8px; justify-content:center; margin:10px 0; }
  .dot { width:14px; height:14px; border-radius:50%; background:var(--line); } .dot.done { background:var(--accent); } .dot.cur { outline:3px solid var(--accent); outline-offset:2px; }
  .lang { display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  .lang button { padding:8px 16px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:16px; }
  .lang button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .hidden { display:none !important }
  .err { color:var(--bad); }
</style>
</head>
<body>
<main>

<div id="msg" class="card hidden"><h1 id="msgTxt"></h1></div>

<section id="customer" class="hidden">
  <div class="lang" id="lang"></div>
  <div class="card"><div class="sub" id="shopLbl"></div><h1 id="shop"></h1></div>

  <div class="card" id="stepAmount">
    <div id="tEnter"></div>
    <input id="amt" class="amt" type="number" inputmode="decimal" placeholder="₹ 0">
    <div class="sub" id="plan"></div>
    <button class="btn" id="start"></button>
  </div>

  <div class="card hidden" id="stepPay">
    <div class="sub" id="partLbl"></div>
    <div class="big" id="partAmt"></div>
    <div class="dots" id="dots"></div>
    <a class="btn" id="payBtn" href="#"></a>
    <a href="#" id="retry" class="sub hidden" style="display:block;margin:12px 0"></a>
    <div id="apps" class="hidden">
      <div class="sub" id="chooseTxt"></div>
      <a class="btn" data-k="pp">PhonePe</a>
      <a class="btn" data-k="gp">Google Pay</a>
      <a class="btn" data-k="pt">Paytm</a>
      <a class="btn" data-k="bh">BHIM</a>
      <a class="btn" data-k="am">Amazon Pay</a>
      <a class="btn" data-k="cr">CRED</a>
      <a class="btn" data-k="wa">WhatsApp</a>
    </div>
  </div>

  <div class="card hidden" id="stepDone"><div class="big">✅</div><h1 id="tDone"></h1><div class="big" id="doneAmt"></div><div class="sub" id="confirm"></div></div>
</section>

</main>

<script>
const $ = id => document.getElementById(id);
const inr = p => '₹' + (p/100).toLocaleString('en-IN', {minimumFractionDigits: p%100 ? 2 : 0});
const CFG = window.SPLITPAY || {};
const MAX = 200000; // 2000 rupees in paise

const T = {
  en:{shop:'Pay to', enter:'How much is the bill?', start:'Next', pay:'Pay', part:'Part', of:'of', split:n=>`Will be paid in ${n} parts`, one:'Single payment',
      done:'All paid! Show this screen to the shop.', choose:'Choose your payment app', retry:'Last payment did not go through? Pay it again',
      wait:'Waiting for shop to confirm...', ok:'Shop confirmed ✓', bad:'This QR is not working. Please ask the shop.', load:'Loading...'},
  hi:{shop:'यहाँ भुगतान करें', enter:'बिल कितने का है?', start:'आगे', pay:'भुगतान करें', part:'भाग', of:'/', split:n=>`${n} हिस्सों में भुगतान होगा`, one:'एक भुगतान',
      done:'पूरा भुगतान हो गया! यह स्क्रीन दुकान को दिखाएँ।', choose:'अपना पेमेंट ऐप चुनें', retry:'पिछला पेमेंट नहीं हुआ? फिर से करें',
      wait:'दुकानदार की पुष्टि का इंतज़ार...', ok:'दुकानदार ने पुष्टि की ✓', bad:'यह QR काम नहीं कर रहा। दुकानदार से पूछें।', load:'लोड हो रहा है...'},
  te:{shop:'చెల్లించాల్సిన షాప్', enter:'బిల్లు ఎంత?', start:'తరువాత', pay:'చెల్లించండి', part:'భాగం', of:'/', split:n=>`${n} భాగాలుగా చెల్లింపు`, one:'ఒకే చెల్లింపు',
      done:'మొత్తం చెల్లించారు! ఈ స్క్రీన్ షాప్‌కు చూపించండి.', choose:'మీ చెల్లింపు యాప్ ఎంచుకోండి', retry:'గత చెల్లింపు కాలేదా? మళ్ళీ చేయండి',
      wait:'షాప్ నిర్ధారణ కోసం వేచి ఉంది...', ok:'షాప్ నిర్ధారించింది ✓', bad:'ఈ QR పనిచేయడం లేదు. షాప్‌ను అడగండి.', load:'లోడ్ అవుతోంది...'}
};
const isAndroid = /android/i.test(navigator.userAgent);
const schemes = {pp:'phonepe://pay?', gp:'tez://upi/pay?', pt:'paytmmp://pay?', bh:'bhim://upi/pay?', am:'amazonpay://upi/pay?', cr:'credpay://upi/pay?', wa:'upi://pay?'};
let L = 'en';
try { L = localStorage.lang || ((navigator.language||'').startsWith('te') ? 'te' : (navigator.language||'').startsWith('hi') ? 'hi' : 'en'); } catch(e){}
if (!T[L]) L = 'en';

function split(total, limit) {
  const n = Math.ceil(total / limit), base = Math.floor(total / n), r = total - base * n;
  return Array.from({length:n}, (_, i) => base + (i < r ? 1 : 0));
}

const q = new URLSearchParams(location.search);
const slug = q.get('s');
let pa = q.get('pa'), pn = q.get('pn') || 'Shop', mc = q.get('mc') || '';
let limit = Math.min(Math.round(parseFloat(q.get('lim') || '2000') * 100) || MAX, MAX);
let parts = [], i = 0, waiting = false, curQs = '', bill = null;

function rpc(fn, args) {
  return fetch(CFG.url + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{apikey:CFG.anon, Authorization:'Bearer ' + CFG.anon, 'Content-Type':'application/json'},
    body: JSON.stringify(args)
  }).then(r => r.ok ? r.text().then(t => t ? JSON.parse(t) : null) : Promise.reject(r.status));
}

function message(key) { $('msg').classList.remove('hidden'); $('msgTxt').textContent = T[L][key]; }

if (slug) {
  message('load');
  if (!CFG.url) message('bad');
  else rpc('get_shop', {p_slug: slug}).then(rows => {
    if (!rows || !rows[0]) return message('bad');
    pa = rows[0].upi_id; pn = rows[0].name; mc = rows[0].merchant_code || '';
    limit = Math.min(rows[0].max_payment * 100, MAX);
    $('msg').classList.add('hidden'); initCustomer();
  }).catch(() => message('bad'));
} else if (pa) initCustomer();
else message('bad');

function initCustomer() {
  $('customer').classList.remove('hidden');
  $('shop').textContent = pn;
  $('lang').innerHTML = [['en','English'],['hi','हिंदी'],['te','తెలుగు']].map(([k,n]) => `<button data-l="${k}" class="${k===L?'on':''}">${n}</button>`).join('');
  $('lang').onclick = e => { if (e.target.dataset.l) { L = e.target.dataset.l; try{localStorage.lang=L}catch(_){} initCustomer(); render(); } };
  const t = T[L];
  $('shopLbl').textContent = t.shop; $('tEnter').textContent = t.enter; $('start').textContent = t.start;
  $('chooseTxt').textContent = t.choose; $('retry').textContent = t.retry; $('tDone').textContent = t.done;
  $('amt').oninput = () => {
    const p = Math.round(parseFloat($('amt').value) * 100);
    $('plan').textContent = p > limit ? t.split(Math.ceil(p/limit)) + ': ' + split(p, limit).map(inr).join(' + ') : '';
  };
  $('start').onclick = () => {
    const p = Math.round(parseFloat($('amt').value) * 100);
    if (!(p > 0)) return $('amt').focus();
    parts = split(p, limit); i = 0; bill = null;
    if (slug) rpc('start_bill', {p_slug: slug, p_total: p, p_parts: parts.length}).then(r => { bill = r && r[0]; }).catch(() => {});
    show('stepPay'); render(); launch();
  };
  document.querySelectorAll('#stepPay a').forEach(a => a.onclick = () => { waiting = true; if (a.dataset.k) { try { localStorage.app = a.dataset.k; } catch(e){} } });
  $('retry').onclick = e => { e.preventDefault(); if (i > 0) { i--; render(); launch(); } };
}

function show(id) { ['stepAmount','stepPay','stepDone'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }

function render() {
  if (!parts.length) return;
  const t = T[L], n = parts.length;
  $('partLbl').textContent = n > 1 ? `${t.part} ${i+1} ${t.of} ${n}` : t.one;
  $('partAmt').textContent = inr(parts[i]);
  $('retry').classList.toggle('hidden', i === 0);
  $('dots').innerHTML = parts.map((_, k) => `<span class="dot ${k<i?'done':k===i?'cur':''}"></span>`).join('');
  $('payBtn').textContent = `${t.pay} ${inr(parts[i])}`;
  const p = {pa, pn, am:(parts[i]/100).toFixed(2), cu:'INR', tn: n>1 ? `Bill part ${i+1} of ${n}` : 'Bill'};
  if (mc) p.mc = mc;
  const qs = new URLSearchParams(p).toString().replace(/\+/g, '%20'); curQs = qs;
  // Android: an intent link makes the phone list every installed UPI app.
  // iPhone: no such list exists, so the customer picks an app once and we remember it.
  $('payBtn').classList.toggle('hidden', !isAndroid);
  $('apps').classList.toggle('hidden', isAndroid);
  $('payBtn').href = isAndroid ? 'intent://pay?' + qs + '#Intent;scheme=upi;end' : '#';
  document.querySelectorAll('#apps a').forEach(a => a.href = schemes[a.dataset.k] + qs);
}

// Pop the phone's UPI app list up straight away (runs inside a tap, so browsers allow it).
function launch() {
  if (isAndroid) { waiting = true; location.href = $('payBtn').href; return; }
  let k = ''; try { k = localStorage.app || ''; } catch(e){}
  if (schemes[k]) { waiting = true; location.href = schemes[k] + curQs; }
}

// Back from the payment app: go straight on to the next part, or finish.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !waiting || !parts.length) return;
  waiting = false; i++;
  if (i >= parts.length) finish(); else { show('stepPay'); render(); launch(); }
});

function finish() {
  $('doneAmt').textContent = inr(parts.reduce((a,b)=>a+b,0)); show('stepDone');
  if (!bill) return;
  const t = T[L];
  $('confirm').textContent = t.wait;
  rpc('claim_bill', {p_id: bill.id, p_token: bill.token}).catch(() => {});
  let tries = 0;
  const timer = setInterval(() => {
    if (++tries > 200) return clearInterval(timer);
    rpc('bill_status', {p_id: bill.id, p_token: bill.token}).then(s => {
      if (s === 'received') {
        clearInterval(timer);
        $('confirm').textContent = t.ok; $('confirm').style.color = 'var(--accent)'; $('confirm').style.fontWeight = '700';
      }
    }).catch(() => {});
  }, 3000);
}
</script>
</body>
</html>
